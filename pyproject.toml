[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-agent"
version = "0.1.0"
description = "An Agentic, Tool-Augmented Vision-Language Model for Panoramic Dental Radiograph Diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VLM-Dental Research Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "trl>=0.10.0",
    "huggingface-hub>=0.21.0",
    "qwen-vl-utils>=0.0.8",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "PyYAML>=6.0.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.0.20",
    "ultralytics>=8.1.0",
]

[project.optional-dependencies]
api = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
all = [
    "dental-agent[api,dev]"
]

[project.scripts]
dental-agent = "dental_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dental_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
