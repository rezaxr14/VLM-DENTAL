n healthy tissue</text><path d="M 32 179.8 L 34.16 182.5 L 38.0 175.0" fill="none" stroke="#2F6B3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="182" font-family="Helvetica" font-size="8.6" fill="#444444">no directive leakage in CoT</text><path d="M 32 197.8 L 34.16 200.5 L 38.0 193.0" fill="none" stroke="#2F6B3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="200" font-family="Helvetica" font-size="8.6" fill="#444444">format + FDI notation valid</text><text x="32" y="232" font-family="Helvetica" font-size="8.2" fill="#666666">strict rate pacing via the</text><text x="32" y="244" font-family="Helvetica" font-size="8.2" fill="#666666">provider pool</text><polyline points="196.0,130.0 237.0,130.0" fill="none" stroke="#B5383C" stroke-width="1.6"/><polygon points="246.0,130.0 237.0,134.2 237.0,125.8" fill="#B5383C" stroke="none"/><text x="222.0" y="110" font-family="Helvetica" font-size="8.2" font-weight="bold" text-anchor="middle" fill="#B5383C">REJECT</text><text x="222.0" y="121" font-family="Helvetica" font-size="8.2" font-weight="bold" text-anchor="middle" fill="#B5383C">· 92</text><rect x="248" y="56" width="150" height="200" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><circle cx="262" cy="68" r="3.3000000000000003" fill="none" stroke="#666666" stroke-width="1.5"/><line x1="266.3" y1="68.0" x2="268.5" y2="68.0" stroke="#666666" stroke-width="1.7"/><line x1="265.1" y1="71.1" x2="266.6" y2="72.6" stroke="#666666" stroke-width="1.7"/><line x1="262.0" y1="72.3" x2="262.0" y2="74.5" stroke="#666666" stroke-width="1.7"/><line x1="258.9" y1="71.1" x2="257.4" y2="72.6" stroke="#666666" stroke-width="1.7"/><line x1="257.7" y1="68.0" x2="255.5" y2="68.0" stroke="#666666" stroke-width="1.7"/><line x1="258.9" y1="64.9" x2="257.4" y2="63.4" stroke="#666666" stroke-width="1.7"/><line x1="262.0" y1="63.7" x2="262.0" y2="61.5" stroke="#666666" stroke-width="1.7"/><line x1="265.1" y1="64.9" x2