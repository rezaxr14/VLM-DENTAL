FF" stroke="#999999" stroke-width="1.1"/><circle cx="456" cy="74" r="4.5" fill="none" stroke="#555555" stroke-width="1.6"/><line x1="459.375" y1="77.375" x2="464.55" y2="82.55" stroke="#555555" stroke-width="2.2" stroke-linecap="round"/><text x="476" y="80" font-family="Helvetica" font-size="10.2" font-weight="bold" fill="#444444">First-pass audit</text><text x="450" y="102" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#444444">92 rejections on 3,694 traces</text><text x="450" y="114" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#444444">(97.5% pass)</text><text x="450" y="138" font-family="Helvetica" font-size="8.2" fill="#555555">hallucinated findings on</text><text x="450" y="149" font-family="Helvetica" font-size="8.2" fill="#555555">healthy tissue</text><rect x="450" y="155" width="110" height="9" rx="2" fill="#B5383C" stroke="none" stroke-width="0"/><text x="566" y="163" font-family="Helvetica" font-size="8.4" font-weight="bold" fill="#B5383C">66</text><text x="450" y="174" font-family="Helvetica" font-size="8.2" fill="#555555">contradicted the ground truth</text><rect x="450" y="180" width="26" height="9" rx="2" fill="#DD8452" stroke="none" stroke-width="0"/><text x="482" y="188" font-family="Helvetica" font-size="8.4" font-weight="bold" fill="#B5383C">15</text><text x="450" y="206" font-family="Helvetica" font-size="8.2" fill="#555555">drift left uncorrected</text><rect x="450" y="212" width="19" height="9" rx="2" fill="#ff7f0e" stroke="none" stroke-width="0"/><text x="475" y="220" font-family="Helvetica" font-size="8.4" font-weight="bold" fill="#8A4B06">11</text><text x="450" y="238" font-family="Helvetica" font-size="8.0" fill="#8A4B06">category 3 exists because</text><text x="450" y="248" font-family="Helvetica" font-size="8.0" fill="#8A4B06">perturbation pressure</text><rect x="10" y="294" width="620" height="222" rx="6" fill="#FDFBF2" stroke="#E5D9B8" stroke-width="1.2"/><rect x="438" y="294" width="192" height="2