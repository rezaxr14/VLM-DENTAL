<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1020" viewBox="0 0 1080 1020"><rect width="1080" height="1020" fill="#FFFFFF"/><text x="24" y="30" font-family="Helvetica" font-size="22" font-weight="bold" fill="#17324D">A</text><text x="56" y="30" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324D">One numerical target; two proposal mechanisms</text><text x="56" y="52" font-family="Helvetica" font-size="11" fill="#667787">Greedy verification with symbolic tokens; scheduling is illustrative, not a measured trace</text><text x="24" y="88" font-family="Helvetica" font-size="15" font-weight="bold" fill="#17324D">Committed prefix</text><rect x="24" y="103" width="85" height="40" rx="2" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="66.5" y="128.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#303A45">x(t-3)</text><rect x="120" y="103" width="85" height="40" rx="2" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="162.5" y="128.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#303A45">x(t-2)</text><rect x="216" y="103" width="85" height="40" rx="2" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="258.5" y="128.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#303A45">x(t-1)</text><rect x="312" y="103" width="85" height="40" rx="2" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="354.5" y="128.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#303A45">x(t)</text><text x="24" y="166" font-family="Helvetica" font-size="14" fill="#667787">Reusable target KV cache for committed context</text><text x="450" y="88" font-family="Helvetica" font-size="16" font-weight="bold" fill="#B8561F">Native MTP</text><text x="450" y="111" font-family="Helvetica" font-size="15" fill="#303A45">Use preserved mtp.* tensors;</text><text x="450" y="131" font-family="Helvetica" font-size="15" fill="#303A45">propose d1, d2, d3 in a draft loop.</text><text x="790" y="88" font-family="Helvetica" font-size="16" font-weight="bold" fill="#34548A">N-gram lookup</text><text x="790" y="111" font-family="Helvetica" font-size="15" fill="#303A45">Match a context suffix;</text><text x="790" y="131" font-family="Helvetica" font-size="15" fill="#303A45">reuse following tokens as proposals.</text><line x1="24" y1="190" x2="1056" y2="190" stroke="#DCE6ED" stroke-width="1.0"/><text x="24" y="232" font-family="Helvetica" font-size="22" font-weight="bold" fill="#17324D">B</text><text x="56" y="232" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324D">Parallel target verification</text><text x="56" y="254" font-family="Helvetica" font-size="11" fill="#667787">Target distributions follow the same prefix and the proposed causal token history</text><text x="144.0" y="285" font-family="Courier" font-size="14" text-anchor="middle" fill="#303A45">K1</text><text x="182.0" y="285" font-family="Courier" font-size="14" text-anchor="middle" fill="#303A45">K2</text><text x="220.0" y="285" font-family="Courier" font-size="14" text-anchor="middle" fill="#303A45">K3</text><text x="258.0" y="285" font-family="Courier" font-size="14" text-anchor="middle" fill="#303A45">d1</text><text x="296.0" y="285" font-family="Courier" font-size="14" text-anchor="middle" fill="#303A45">d2</text><text x="334.0" y="285" font-family="Courier" font-size="14" text-anchor="middle" fill="#303A45">d3</text><text x="76" y="322" font-family="Courier" font-size="16" font-weight="bold" fill="#34548A">p1</text><rect x="125" y="297" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="163" y="297" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="201" y="297" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="239" y="297" width="35" height="35" rx="0" fill="#F3F5F7" stroke="#FFFFFF" stroke-width="1.1"/><rect x="277" y="297" width="35" height="35" rx="0" fill="#F3F5F7" stroke="#FFFFFF" stroke-width="1.1"/><rect x="315" y="297" width="35" height="35" rx="0" fill="#F3F5F7" stroke="#FFFFFF" stroke-width="1.1"/><text x="76" y="360" font-family="Courier" font-size="16" font-weight="bold" fill="#34548A">p2</text><rect x="125" y="335" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="163" y="335" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="201" y="335" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="239" y="335" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="277" y="335" width="35" height="35" rx="0" fill="#F3F5F7" stroke="#FFFFFF" stroke-width="1.1"/><rect x="315" y="335" width="35" height="35" rx="0" fill="#F3F5F7" stroke="#FFFFFF" stroke-width="1.1"/><text x="76" y="398" font-family="Courier" font-size="16" font-weight="bold" fill="#34548A">p3</text><rect x="125" y="373" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="163" y="373" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="201" y="373" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="239" y="373" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="277" y="373" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="315" y="373" width="35" height="35" rx="0" fill="#F3F5F7" stroke="#FFFFFF" stroke-width="1.1"/><text x="76" y="436" font-family="Courier" font-size="16" font-weight="bold" fill="#34548A">p4</text><rect x="125" y="411" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="163" y="411" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="201" y="411" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="239" y="411" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="277" y="411" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><rect x="315" y="411" width="35" height="35" rx="0" fill="#34548A" stroke="#FFFFFF" stroke-width="1.1"/><text x="24" y="479" font-family="Helvetica" font-size="14" fill="#667787">Visibility mask, not attention scores</text><text x="24" y="505" font-family="Helvetica" font-size="15" fill="#303A45">K1-K3 symbolize the cached prefix.</text><text x="24" y="526" font-family="Helvetica" font-size="15" fill="#303A45">Each p(i) predicts a next token.</text><text x="24" y="547" font-family="Helvetica" font-size="15" fill="#303A45">New query positions are target-batched.</text><text x="24" y="568" font-family="Helvetica" font-size="15" fill="#303A45">Backend cache scheduling may differ.</text><text x="505" y="285" font-family="Helvetica" font-size="15" font-weight="bold" fill="#B8561F">Draft</text><text x="505" y="350" font-family="Helvetica" font-size="15" font-weight="bold" fill="#34548A">Target argmax</text><text x="505" y="428" font-family="Helvetica" font-size="15" font-weight="bold" fill="#2F7D45">Commit</text><rect x="655" y="258" width="95" height="42" rx="2" fill="#FFF3E9" stroke="#DCE6ED" stroke-width="1.1"/><text x="702.5" y="284.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#B8561F">d1</text><rect x="655" y="323" width="95" height="42" rx="2" fill="#EDF3FB" stroke="#DCE6ED" stroke-width="1.1"/><text x="702.5" y="349.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#34548A">g1</text><line x1="700" y1="302" x2="700" y2="320" stroke="#2F7D45" stroke-width="2"/><text x="700" y="390" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#2F7D45">match</text><rect x="655" y="403" width="95" height="42" rx="2" fill="#ECF5EE" stroke="#DCE6ED" stroke-width="1.1"/><text x="702.5" y="429.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#2F7D45">g1</text><rect x="778" y="258" width="95" height="42" rx="2" fill="#FFF3E9" stroke="#DCE6ED" stroke-width="1.1"/><text x="825.5" y="284.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#B8561F">d2</text><rect x="778" y="323" width="95" height="42" rx="2" fill="#EDF3FB" stroke="#DCE6ED" stroke-width="1.1"/><text x="825.5" y="349.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#34548A">g2</text><line x1="823" y1="302" x2="823" y2="320" stroke="#2F7D45" stroke-width="2"/><text x="823" y="390" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#2F7D45">match</text><rect x="778" y="403" width="95" height="42" rx="2" fill="#ECF5EE" stroke="#DCE6ED" stroke-width="1.1"/><text x="825.5" y="429.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#2F7D45">g2</text><rect x="901" y="258" width="95" height="42" rx="2" fill="#FFF3E9" stroke="#DCE6ED" stroke-width="1.1"/><text x="948.5" y="284.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#B8561F">d3</text><rect x="901" y="323" width="95" height="42" rx="2" fill="#EDF3FB" stroke="#DCE6ED" stroke-width="1.1"/><text x="948.5" y="349.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#34548A">g3</text><line x1="946" y1="302" x2="946" y2="320" stroke="#B5383C" stroke-width="2"/><text x="946" y="390" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#B5383C">mismatch</text><rect x="901" y="403" width="95" height="42" rx="2" fill="#EDF3FB" stroke="#DCE6ED" stroke-width="1.1"/><text x="948.5" y="429.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#34548A">g3</text><text x="505" y="482" font-family="Helvetica" font-size="15" fill="#303A45">Accept the longest agreeing prefix; replace at the first mismatch.</text><text x="505" y="505" font-family="Helvetica" font-size="15" fill="#303A45">Discard the rejected and dependent draft suffix.</text><text x="505" y="528" font-family="Helvetica" font-size="15" fill="#303A45">All accepted? The target can supply a bonus token.</text><text x="505" y="551" font-family="Helvetica" font-size="15" fill="#303A45">Only verified, parsed output can dispatch a tool.</text><line x1="24" y1="590" x2="1056" y2="590" stroke="#DCE6ED" stroke-width="1.0"/><text x="24" y="632" font-family="Helvetica" font-size="22" font-weight="bold" fill="#17324D">C</text><text x="56" y="632" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324D">What can become faster, and what stays fixed</text><text x="56" y="654" font-family="Helvetica" font-size="11" fill="#667787">Separate image-prefill, token decoding and real tool execution</text><text x="24" y="687" font-family="Helvetica" font-size="15" font-weight="bold" fill="#17324D">Baseline</text><rect x="140" y="662" width="132" height="40" rx="2" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="206.0" y="687.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#303A45">target g1</text><rect x="288" y="662" width="132" height="40" rx="2" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="354.0" y="687.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#303A45">target g2</text><rect x="436" y="662" width="132" height="40" rx="2" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="502.0" y="687.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#303A45">target g3</text><text x="24" y="745" font-family="Helvetica" font-size="15" font-weight="bold" fill="#17324D">Speculative</text><rect x="140" y="720" width="132" height="40" rx="2" fill="#FFF3E9" stroke="#DCE6ED" stroke-width="1.1"/><text x="206.0" y="745.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#B8561F">draft block</text><rect x="288" y="720" width="280" height="40" rx="2" fill="#EDF3FB" stroke="#DCE6ED" stroke-width="1.1"/><text x="428.0" y="745.0" font-family="Courier" font-size="16" text-anchor="middle" fill="#34548A">target verifies the block</text><text x="24" y="794" font-family="Helvetica" font-size="14" fill="#667787">Logical operations: widths do not encode latency or a claimed speedup.</text><rect x="630" y="661" width="426" height="150" rx="0" fill="#FFFFFF" stroke="#DCE6ED" stroke-width="1.1"/><rect x="630" y="661" width="426" height="28" rx="0" fill="#EDF3F8" stroke="#DCE6ED" stroke-width="1.1"/><text x="642" y="680" font-family="Courier" font-size="14" font-weight="bold" fill="#34548A">Recorded per episode / request</text><text x="642" y="704" font-family="Courier" font-size="14" fill="#303A45">wall_seconds       tool_seconds</text><text x="642" y="727" font-family="Courier" font-size="14" fill="#303A45">prefill_seconds    decode_seconds</text><text x="642" y="750" font-family="Courier" font-size="14" fill="#303A45">generated_tokens   accepted / drafted</text><text x="642" y="773" font-family="Courier" font-size="14" fill="#303A45">GPU peaks   raw outputs + tool calls</text><text x="24" y="854" font-family="Helvetica" font-size="22" font-weight="bold" fill="#17324D">D</text><text x="56" y="854" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324D">Evidence gates and execution envelope</text><text x="56" y="876" font-family="Helvetica" font-size="11" fill="#667787">Baseline and speculation use the same merged checkpoint; never compare across numeric targets</text><text x="24" y="898" font-family="Helvetica" font-size="15" fill="#303A45">BEFORE: compare mtp.* keys, shapes, dtypes and bytes with the original native base.</text><text x="24" y="921" font-family="Helvetica" font-size="15" fill="#303A45">AFTER: compare decoded turns, tool calls, final answers and pooled dev exact F1.</text><text x="24" y="944" font-family="Helvetica" font-size="15" fill="#303A45">FAILURE: retain divergences; suppress equivalence-qualified speedup claims.</text><text x="24" y="982" font-family="Helvetica" font-size="14" fill="#667787">Requested: dual T4 = FP16 / TP2; RTX 4090 and 48-GB RTX Pro = BF16 / TP1.</text><text x="24" y="1002" font-family="Helvetica" font-size="14" fill="#667787">Fit/support need a real runtime probe. This runner does not supply TPU speculation.</text></svg>