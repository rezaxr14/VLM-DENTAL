<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="700" viewBox="0 0 640 700"><rect width="640" height="700" fill="#FFFFFF"/><g transform="translate(0,-50)"><rect x="10" y="60" width="620" height="232" rx="6" fill="#F4FBF6" stroke="#55A868" stroke-width="1.4"/><rect x="22" y="70" width="62" height="18" rx="9" fill="#2F7D45" stroke="none" stroke-width="0"/><text x="53" y="83" font-family="Helvetica" font-size="8.8" font-weight="bold" text-anchor="middle" fill="#FFFFFF">IN USE</text><text x="618" y="83" font-family="Helvetica" font-size="8.8" text-anchor="end" fill="#2F6B3C">feeds the released corpus</text><rect x="22" y="98" width="298" height="184" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><ellipse cx="41.0" cy="111" rx="7.0" ry="2.8" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 34 111 L 34 121.0 A 7.0 2.8 0 0 0 48.0 121.0 L 48.0 111" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 34 116.5 A 7.0 2.8 0 0 0 48.0 116.5" fill="none" stroke="#4C72B0" stroke-width="1.1"/><text x="58" y="122" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#444444">DENTEX</text><text x="308" y="122" font-family="Helvetica" font-size="9.2" text-anchor="end" fill="#34548A">2,332 images</text><text x="34" y="144" font-family="Helvetica" font-size="8.8" fill="#444444">quadrant · enumeration · diagnosis labels</text><text x="34" y="157" font-family="Helvetica" font-size="8.8" fill="#444444">4 pathology classes + box coordinates</text><text x="34" y="173" font-family="Helvetica" font-size="8.6" fill="#666666">the only panoramic source pairing tooth position</text><text x="34" y="185" font-family="Helvetica" font-size="8.6" fill="#666666">with all four reward-relevant classes</text><rect x="34" y="196" width="130" height="20" rx="10" fill="#F0F7F0" stroke="#55A868" stroke-width="1.0"/><text x="99" y="210" font-family="Helvetica" font-size="8.8" font-weight="bold" text-anchor="middle" fill="#2F6B3C">loader: complete</text><text x="34" y="238" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#34548A">contributes 705 corpus traces</text><text x="34" y="251" font-family="Helvetica" font-size="8.6" fill="#666666">(678 pathology + 27 healthy)</text><text x="34" y="270" font-family="Helvetica" font-size="8.6" fill="#666666">grounding pool: 1,339 images · 21,624 tooth boxes</text><rect x="330" y="98" width="290" height="184" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><ellipse cx="349.0" cy="111" rx="7.0" ry="2.8" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 342 111 L 342 121.0 A 7.0 2.8 0 0 0 356.0 121.0 L 356.0 111" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 342 116.5 A 7.0 2.8 0 0 0 356.0 116.5" fill="none" stroke="#4C72B0" stroke-width="1.1"/><text x="366" y="122" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#444444">Tufts Dental Database</text><text x="608" y="122" font-family="Helvetica" font-size="9.2" text-anchor="end" fill="#34548A">1,000 images</text><text x="342" y="144" font-family="Helvetica" font-size="8.8" fill="#444444">per-tooth boxes (Universal Numbering)</text><text x="342" y="157" font-family="Helvetica" font-size="8.8" fill="#444444">expert pathology layer · 25,184 boxes</text><text x="342" y="173" font-family="Helvetica" font-size="8.6" fill="#666666">periapical maps onto the DENTEX taxonomy;</text><text x="342" y="185" font-family="Helvetica" font-size="8.6" fill="#666666">no caries findings in this layer</text><rect x="342" y="196" width="190" height="20" rx="10" fill="#FFF4E8" stroke="#F0B27A" stroke-width="1.0"/><text x="437" y="210" font-family="Helvetica" font-size="8.8" font-weight="bold" text-anchor="middle" fill="#8A4B06">loader: partial - 1 open question</text><text x="342" y="238" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#34548A">contributes 1,142 corpus traces</text><text x="342" y="251" font-family="Helvetica" font-size="8.6" fill="#666666">(202 overlap + 660 healthy + 280 all-diseases)</text><text x="342" y="270" font-family="Helvetica" font-size="8.6" fill="#666666">grounding pool: 1,000 images · 25,184 boxes</text><rect x="10" y="304" width="620" height="346" rx="6" fill="#FBFBFC" stroke="#CCCCCC" stroke-width="1.2"/><rect x="22" y="314" width="124" height="18" rx="9" fill="#5F6B7A" stroke="none" stroke-width="0"/><text x="84" y="327" font-family="Helvetica" font-size="8.8" font-weight="bold" text-anchor="middle" fill="#FFFFFF">CANDIDATE POOL</text><text x="618" y="327" font-family="Helvetica" font-size="8.8" text-anchor="end" fill="#666666">pending - not used in this work</text><rect x="22" y="342" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="32" y="359" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">Dental Radiography</text><text x="304" y="359" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">1,272</text><text x="32" y="375" font-family="Helvetica" font-size="8.6" fill="#666666">no confirmed diagnosis taxonomy</text><text x="32" y="390" font-family="Helvetica" font-size="8.4" fill="#666666">(systematic review)</text><rect x="326" y="342" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="336" y="359" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">DNS (UFBA-UESC)</text><text x="608" y="359" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">543</text><text x="336" y="375" font-family="Helvetica" font-size="8.6" fill="#666666">FDI boxes in COCO - access on request</text><text x="336" y="390" font-family="Helvetica" font-size="8.4" fill="#666666">(targeted follow-up)</text><rect x="22" y="408" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="32" y="425" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">Segmented Mandibles</text><text x="304" y="425" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">232</text><text x="32" y="441" font-family="Helvetica" font-size="8.6" fill="#666666">mandible-only masks, not per-tooth</text><text x="32" y="456" font-family="Helvetica" font-size="8.4" fill="#666666">(systematic review)</text><rect x="326" y="408" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="336" y="425" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">TL-pano</text><text x="608" y="425" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">197</text><text x="336" y="441" font-family="Helvetica" font-size="8.6" fill="#666666">FDI + quadrant labels - NC license</text><text x="336" y="456" font-family="Helvetica" font-size="8.4" fill="#666666">(targeted follow-up)</text><rect x="22" y="474" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="32" y="491" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">TK Tooth Number Code</text><text x="304" y="491" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">188</text><text x="32" y="507" font-family="Helvetica" font-size="8.6" fill="#666666">numbering only, no diagnosis</text><text x="32" y="522" font-family="Helvetica" font-size="8.4" fill="#666666">(systematic review)</text><rect x="326" y="474" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="336" y="491" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">Tunisia Panoramic</text><text x="608" y="491" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">180</text><text x="336" y="507" font-family="Helvetica" font-size="8.6" fill="#666666">in progress - 1 open FDI question</text><text x="336" y="522" font-family="Helvetica" font-size="8.4" fill="#666666">(systematic review)</text><rect x="22" y="540" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="32" y="557" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">Panoramic-Paraguay</text><text x="304" y="557" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">135</text><text x="32" y="573" font-family="Helvetica" font-size="8.6" fill="#666666">thin documentation in the review</text><text x="32" y="588" font-family="Helvetica" font-size="8.4" fill="#666666">(systematic review)</text><rect x="326" y="540" width="292" height="58" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="336" y="557" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">Panoramic-Caries-Seg</text><text x="608" y="557" font-family="Helvetica" font-size="9.0" text-anchor="end" fill="#34548A">75</text><text x="336" y="573" font-family="Helvetica" font-size="8.6" fill="#666666">binary caries masks (pixel level)</text><text x="336" y="588" font-family="Helvetica" font-size="8.4" fill="#666666">(systematic review)</text><text x="22" y="620" font-family="Helvetica" font-size="8.8" fill="#444444">diagnosis-labeled: 1 of 8 (binary caries masks) · grounding-only: 7 of 8</text><text x="22" y="634" font-family="Helvetica" font-size="8.8" fill="#444444">promotion rule: verified end-to-end annotation semantics, per dataset</text><rect x="10" y="662" width="620" height="76" rx="6" fill="#F7F8FA" stroke="#E3E3E3" stroke-width="1.0"/><text x="22" y="678" font-family="Helvetica" font-size="8.6" fill="#666666">catalog transcribed from a systematic review of 16 public dental imaging datasets</text><text x="22" y="691" font-family="Helvetica" font-size="8.6" fill="#666666">(Uribe et al. 2024) plus targeted follow-up search</text><text x="22" y="710" font-family="Helvetica" font-size="8.6" fill="#666666">the diagnosis-label vs grounding-only flag drives purpose: grounding candidates generalize</text><text x="22" y="723" font-family="Helvetica" font-size="8.6" fill="#666666">locate_tooth, diagnosis candidates feed trace generation</text></g></svg>