<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="664" viewBox="0 0 1080 664"><rect width="1080" height="664" fill="#FFFFFF"/><text x="540" y="24" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#444444">The data layer: two sources in use, eight candidates on file</text><text x="540" y="42" font-family="Helvetica" font-size="9.5" text-anchor="middle" fill="#777777">a candidate is promoted only after its annotation semantics are verified - two loaders deliberately stop at one open question each</text><rect x="16" y="58" width="384" height="522" rx="6" fill="#F4FBF6" stroke="#55A868" stroke-width="1.4"/><rect x="32" y="74" width="70" height="20" rx="10" fill="#55A868" stroke="none" stroke-width="0"/><text x="67" y="88" font-family="Helvetica" font-size="8.6" font-weight="bold" text-anchor="middle" fill="#FFFFFF">IN USE</text><text x="384" y="88" font-family="Helvetica" font-size="8.2" text-anchor="end" fill="#2F6B3C">feeds the released corpus</text><rect x="32" y="106" width="352" height="210" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><ellipse cx="55.0" cy="125" rx="7.0" ry="2.8" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 48 125 L 48 135.0 A 7.0 2.8 0 0 0 62.0 135.0 L 62.0 125" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 48 130.5 A 7.0 2.8 0 0 0 62.0 130.5" fill="none" stroke="#4C72B0" stroke-width="1.1"/><text x="76" y="134" font-family="Helvetica" font-size="12" font-weight="bold" fill="#444444">DENTEX</text><text x="368" y="134" font-family="Helvetica" font-size="9.2" text-anchor="end" fill="#34548A">2,332 images</text><text x="48" y="158" font-family="Helvetica" font-size="8.2" fill="#444444">quadrant · enumeration · diagnosis labels</text><text x="48" y="172" font-family="Helvetica" font-size="8.2" fill="#444444">4 pathology classes + box coordinates</text><text x="48" y="188" font-family="Helvetica" font-size="7.8" fill="#777777">the only panoramic source pairing tooth position</text><text x="48" y="200" font-family="Helvetica" font-size="7.8" fill="#777777">with all four reward-relevant classes</text><rect x="48" y="214" width="160" height="22" rx="11" fill="#F0F7F0" stroke="#55A868" stroke-width="1.0"/><text x="128" y="229" font-family="Helvetica" font-size="8.2" font-weight="bold" text-anchor="middle" fill="#2F6B3C">loader: complete</text><text x="48" y="260" font-family="Helvetica" font-size="9.0" font-weight="bold" fill="#34548A">contributes 705 corpus traces</text><text x="48" y="276" font-family="Helvetica" font-size="8.0" fill="#777777">(678 pathology + 27 healthy)</text><text x="48" y="296" font-family="Helvetica" font-size="7.8" fill="#777777">grounding pool: 1,339 images · 21,624 tooth boxes</text><rect x="32" y="328" width="352" height="210" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><ellipse cx="55.0" cy="347" rx="7.0" ry="2.8" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 48 347 L 48 357.0 A 7.0 2.8 0 0 0 62.0 357.0 L 62.0 347" fill="none" stroke="#4C72B0" stroke-width="1.4"/><path d="M 48 352.5 A 7.0 2.8 0 0 0 62.0 352.5" fill="none" stroke="#4C72B0" stroke-width="1.1"/><text x="76" y="356" font-family="Helvetica" font-size="12" font-weight="bold" fill="#444444">Tufts Dental Database</text><text x="368" y="356" font-family="Helvetica" font-size="9.2" text-anchor="end" fill="#34548A">1,000 images</text><text x="48" y="380" font-family="Helvetica" font-size="8.2" fill="#444444">per-tooth boxes (Universal Numbering)</text><text x="48" y="394" font-family="Helvetica" font-size="8.2" fill="#444444">expert pathology layer · 25,184 boxes</text><text x="48" y="410" font-family="Helvetica" font-size="7.8" fill="#777777">periapical maps onto the DENTEX taxonomy;</text><text x="48" y="422" font-family="Helvetica" font-size="7.8" fill="#777777">no caries findings in this layer</text><rect x="48" y="436" width="230" height="22" rx="11" fill="#FFF4E8" stroke="#F0B27A" stroke-width="1.0"/><text x="163" y="451" font-family="Helvetica" font-size="8.2" font-weight="bold" text-anchor="middle" fill="#8A4B06">loader: partial - 1 open question</text><text x="48" y="482" font-family="Helvetica" font-size="9.0" font-weight="bold" fill="#34548A">contributes 1,142 corpus traces</text><text x="48" y="498" font-family="Helvetica" font-size="8.0" fill="#777777">(202 overlap + 660 healthy + 280 all-diseases)</text><text x="48" y="518" font-family="Helvetica" font-size="7.8" fill="#777777">grounding pool: 1,000 images · 25,184 boxes</text><rect x="416" y="58" width="648" height="522" rx="6" fill="#FBFBFC" stroke="#CCCCCC" stroke-width="1.2"/><rect x="432" y="74" width="140" height="20" rx="10" fill="#9AA5B1" stroke="none" stroke-width="0"/><text x="502" y="88" font-family="Helvetica" font-size="8.6" font-weight="bold" text-anchor="middle" fill="#FFFFFF">CANDIDATE POOL</text><text x="1048" y="88" font-family="Helvetica" font-size="8.2" text-anchor="end" fill="#777777">pending - not used in this work</text><rect x="432" y="106" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="444" y="126" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">Dental Radiography</text><text x="720" y="126" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">1,272</text><text x="444" y="144" font-family="Helvetica" font-size="7.6" fill="#777777">no confirmed diagnosis taxonomy</text><text x="444" y="168" font-family="Helvetica" font-size="7.0" fill="#999999">(systematic review)</text><rect x="748" y="106" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="760" y="126" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">DNS (UFBA-UESC)</text><text x="1036" y="126" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">543</text><text x="760" y="144" font-family="Helvetica" font-size="7.6" fill="#777777">FDI boxes in COCO - access on request</text><text x="760" y="168" font-family="Helvetica" font-size="7.0" fill="#999999">(targeted follow-up)</text><rect x="432" y="194" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="444" y="214" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">Segmented Mandibles</text><text x="720" y="214" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">232</text><text x="444" y="232" font-family="Helvetica" font-size="7.6" fill="#777777">mandible-only masks, not per-tooth</text><text x="444" y="256" font-family="Helvetica" font-size="7.0" fill="#999999">(systematic review)</text><rect x="748" y="194" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="760" y="214" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">TL-pano</text><text x="1036" y="214" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">197</text><text x="760" y="232" font-family="Helvetica" font-size="7.6" fill="#777777">FDI + quadrant labels - NC license</text><text x="760" y="256" font-family="Helvetica" font-size="7.0" fill="#999999">(targeted follow-up)</text><rect x="432" y="282" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="444" y="302" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">TK Tooth Number Code</text><text x="720" y="302" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">188</text><text x="444" y="320" font-family="Helvetica" font-size="7.6" fill="#777777">numbering only, no diagnosis</text><text x="444" y="344" font-family="Helvetica" font-size="7.0" fill="#999999">(systematic review)</text><rect x="748" y="282" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="760" y="302" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">Tunisia Panoramic</text><text x="1036" y="302" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">180</text><text x="760" y="320" font-family="Helvetica" font-size="7.6" fill="#777777">in progress - 1 open FDI question</text><text x="760" y="344" font-family="Helvetica" font-size="7.0" fill="#999999">(systematic review)</text><rect x="432" y="370" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="444" y="390" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">Panoramic-Paraguay</text><text x="720" y="390" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">135</text><text x="444" y="408" font-family="Helvetica" font-size="7.6" fill="#777777">thin documentation in the review</text><text x="444" y="432" font-family="Helvetica" font-size="7.0" fill="#999999">(systematic review)</text><rect x="748" y="370" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#999999" stroke-width="1.1"/><text x="760" y="390" font-family="Helvetica" font-size="9.2" font-weight="bold" fill="#444444">Panoramic-Caries-Seg</text><text x="1036" y="390" font-family="Helvetica" font-size="8.6" text-anchor="end" fill="#34548A">75</text><text x="760" y="408" font-family="Helvetica" font-size="7.6" fill="#777777">binary caries masks (pixel level)</text><text x="760" y="432" font-family="Helvetica" font-size="7.0" fill="#999999">(systematic review)</text><text x="432" y="496" font-family="Helvetica" font-size="7.8" fill="#444444">diagnosis-labeled: 1 of 8 (binary caries masks) · grounding-only: 7 of 8</text><text x="432" y="512" font-family="Helvetica" font-size="7.8" fill="#444444">promotion rule: verified end-to-end annotation semantics, per dataset</text><rect x="16" y="596" width="1048" height="52" rx="6" fill="#F7F8FA" stroke="#E3E3E3" stroke-width="1.0"/><text x="32" y="618" font-family="Helvetica" font-size="7.8" fill="#777777">catalog transcribed from a systematic review of 16 public dental imaging datasets (Uribe et al. 2024) plus targeted follow-up search</text><text x="32" y="636" font-family="Helvetica" font-size="7.8" fill="#777777">the diagnosis-label vs grounding-only flag drives purpose: grounding candidates generalize locate_tooth, diagnosis candidates feed trace generation</text></svg>