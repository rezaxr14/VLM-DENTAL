<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="562" viewBox="0 0 640 562"><rect width="640" height="562" fill="#FFFFFF"/><g transform="translate(0,-26)"><rect x="10" y="36" width="285" height="62" rx="8" fill="#F0F4FA" stroke="#4C72B0" stroke-width="1.5"/><text x="152.5" y="57" font-family="Helvetica" font-size="11.2" font-weight="bold" text-anchor="middle" fill="#222222">locate_tooth(FDI tooth)</text><text x="152.5" y="74" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">returns a reference box (expert-verified box for</text><text x="152.5" y="87.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">annotated teeth; detector box otherwise)</text><polyline points="295.0,67.0 314.6,67.0" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="323.0,67.0 314.6,70.9 314.6,63.1" fill="#666666" stroke="none"/><rect x="323" y="36" width="307" height="62" rx="8" fill="#FBF6F0" stroke="#DD8452" stroke-width="1.5"/><text x="476.5" y="57" font-family="Helvetica" font-size="11.2" font-weight="bold" text-anchor="middle" fill="#222222">Perturbation roll (fixed rates)</text><text x="476.5" y="74" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">applied to the box SHOWN to the policy,</text><text x="476.5" y="87.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">never to the logged reference box</text><line x1="476.5" y1="98" x2="476.5" y2="116" stroke="#666666" stroke-width="1.5"/><line x1="109" y1="116" x2="529" y2="116" stroke="#666666" stroke-width="1.5"/><polyline points="109.0,116.0 109.0,127.6" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="109.0,136.0 105.1,127.6 112.9,127.6" fill="#666666" stroke="none"/><polyline points="319.0,116.0 319.0,127.6" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="319.0,136.0 315.1,127.6 322.9,127.6" fill="#666666" stroke="none"/><polyline points="529.0,116.0 529.0,127.6" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="529.0,136.0 525.1,127.6 532.9,127.6" fill="#666666" stroke="none"/><rect x="10" y="136" width="198" height="100" rx="8" fill="#F4F4F4" stroke="#999999" stroke-width="1.5"/><text x="109.0" y="157" font-family="Helvetica" font-size="11.2" font-weight="bold" text-anchor="middle" fill="#222222">none - 45%</text><text x="109.0" y="174" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">box unchanged</text><text x="109.0" y="187.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">clean accept-and-proceed</text><text x="109.0" y="201.0" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">demonstration</text><rect x="220" y="136" width="198" height="100" rx="8" fill="#FDF3EA" stroke="#DD8452" stroke-width="1.5"/><text x="319.0" y="157" font-family="Helvetica" font-size="11.2" font-weight="bold" text-anchor="middle" fill="#222222">small - 25%</text><text x="319.0" y="174" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">offset 12-28% of box size, random sign</text><text x="319.0" y="187.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">genuine judgment call: often still fine</text><text x="319.0" y="201.0" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">given zoom padding - never resolved</text><text x="319.0" y="214.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">by the prompt</text><rect x="430" y="136" width="198" height="100" rx="8" fill="#FDEBE6" stroke="#C44E52" stroke-width="1.5"/><text x="529.0" y="157" font-family="Helvetica" font-size="11.2" font-weight="bold" text-anchor="middle" fill="#222222">big - 30%</text><text x="529.0" y="174" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">offset 45-75% of box size, random sign</text><text x="529.0" y="187.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">visually self-evident without any</text><text x="529.0" y="201.0" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">verbal cue</text><line x1="109" y1="236" x2="109" y2="252" stroke="#666666" stroke-width="1.5"/><line x1="109" y1="252" x2="319" y2="252" stroke="#666666" stroke-width="1.5"/><line x1="529" y1="236" x2="529" y2="252" stroke="#666666" stroke-width="1.5"/><line x1="529" y1="252" x2="319" y2="252" stroke="#666666" stroke-width="1.5"/><polyline points="319.0,236.0 319.0,261.6" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="319.0,270.0 315.1,261.6 322.9,261.6" fill="#666666" stroke="none"/><rect x="119" y="270" width="400" height="50" rx="8" fill="#F0F4FA" stroke="#4C72B0" stroke-width="1.5"/><text x="319.0" y="291" font-family="Helvetica" font-size="11.2" font-weight="bold" text-anchor="middle" fill="#222222">Teacher inspects the crop (zoom_crop)</text><text x="319.0" y="308" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">and decides from the pixels alone whether the box is acceptable</text><polyline points="319.0,320.0 319.0,329.6" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="319.0,338.0 315.1,329.6 322.9,329.6" fill="#666666" stroke="none"/><rect x="169" y="338" width="300" height="44" rx="8" fill="#F2F8F2" stroke="#55A868" stroke-width="1.5"/><text x="319.0" y="359" font-family="Helvetica" font-size="11.2" font-weight="bold" text-anchor="middle" fill="#222222">nudge_crop</text><text x="319.0" y="376" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">dx_frac, dy_frac, scale</text><polyline points="319.0,382.0 319.0,391.6" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="319.0,400.0 315.1,391.6 322.9,391.6" fill="#666666" stroke="none"/><rect x="109" y="400" width="420" height="58" rx="8" fill="#F2F8F2" stroke="#55A868" stroke-width="1.5"/><text x="319.0" y="421" font-family="Helvetica" font-size="10.6" font-weight="bold" text-anchor="middle" fill="#222222">zoom_crop on the corrected box - verify - commit finding</text><text x="319.0" y="438" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">the same judgment the deployed policy faces at inference,</text><text x="319.0" y="451.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">with no ground truth available</text><rect x="10" y="478" width="198" height="98" rx="8" fill="#FFFBF0" stroke="#BCBD22" stroke-width="1.2"/><text x="109" y="498" font-family="Helvetica" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#222222">Decoupled from the detector</text><text x="109" y="516.0" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">rates are configured constants,</text><text x="109" y="529.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">not the detector's real error rate,</text><text x="109" y="543.0" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">so demonstrations stay valid as</text><text x="109" y="556.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">the grounding tool improves.</text><rect x="220" y="478" width="198" height="98" rx="8" fill="#FFFBF0" stroke="#BCBD22" stroke-width="1.2"/><text x="319" y="498" font-family="Helvetica" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#222222">No verbal cue</text><text x="319" y="516.0" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">an error is never announced in text;</text><text x="319" y="529.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">magnitude alone must carry the</text><text x="319" y="543.0" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">signal, so the learned behavior</text><text x="319" y="556.5" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">survives to GRPO and inference.</text><rect x="430" y="478" width="198" height="98" rx="8" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1.2"/><text x="529" y="495" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#444444">reference vs. shown box</text><rect x="474" y="506" width="66" height="40" rx="0" fill="none" stroke="#2ca02c" stroke-width="2"/><rect x="500" y="524" width="66" height="34" rx="0" fill="none" stroke="#d62728" stroke-width="2" stroke-dasharray="6,3"/><circle cx="507.0" cy="526.0" r="2.2" fill="#444444"/><!--free:vector--><polyline points="507.0,526.0 527.2,537.6" fill="none" stroke="#444444" stroke-width="1.2"/><polygon points="533.0,541.0 525.6,540.3 528.7,534.9" fill="#444444" stroke="none"/><text x="529" y="572" font-family="Helvetica" font-size="8.6" text-anchor="middle" fill="#444444">shift given in box-relative fractions</text></g></svg>