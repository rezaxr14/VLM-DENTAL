oke-width="0"/><text x="95" y="211.2" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#34548A">0.953</text><rect x="116" y="189.9" width="34" height="310.1" rx="2" fill="#55A868" stroke="none" stroke-width="0"/><text x="133" y="184.9" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#2F6B3C">0.968</text><text x="114" y="516" font-family="Helvetica" font-size="7.8" text-anchor="middle" fill="#777777">fold 0</text><rect x="184" y="240.1" width="34" height="259.9" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="201" y="235.1" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#34548A">0.941</text><rect x="222" y="222.1" width="34" height="277.9" rx="2" fill="#55A868" stroke="none" stroke-width="0"/><text x="239" y="217.1" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#2F6B3C">0.950</text><text x="220" y="516" font-family="Helvetica" font-size="7.8" text-anchor="middle" fill="#777777">fold 1</text><rect x="290" y="201.4" width="34" height="298.6" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="307" y="196.4" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#34548A">0.961</text><rect x="328" y="244" width="34" height="256" rx="2" fill="#55A868" stroke="none" stroke-width="0"/><text x="345" y="239" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#2F6B3C">0.938</text><text x="326" y="516" font-family="Helvetica" font-size="7.8" text-anchor="middle" fill="#777777">fold 2</text><rect x="396" y="210.7" width="34" height="289.3" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="413" y="205.7" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#34548A">0.956</text><rect x="434" y="221.8" width="34" height="278.2" rx="2" fill="#55A868" stroke="none" stroke-width="0"/><text x="451" y="216.8" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#2F6B3C">0.950</text><text x="432" y="516" font-family="Helvetica" font-size="7.8" text-anchor="middle" fill="#777777">fold 3</text><rect x="502" y="236.7" width="34" height="263.3" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="519" y="231.7" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#34548A">0.942</text><rect x="540" y="349.4" width="34" height="150.6" rx="2" fill="#55A868" stroke="none" stroke-width="0"/><text x="557" y="344.4" font-family="Helvetica" font-size="6.6" text-anchor="middle" fill="#2F6B3C">0.881</text><text x="538" y="516" font-family="Helvetica" font-size="7.8" text-anchor="middle" fill="#777777">fold 4</text><line x1="70" y1="500" x2="600" y2="500" stroke="#999999" stroke-width="1.0"/><line x1="70" y1="221" x2="600" y2="221" stroke="#4C72B0" stroke-width="1.0" stroke-dasharray="5,3"/><line x1="70" y1="245.4" x2="600" y2="245.4" stroke="#55A868" stroke-width="1.0" stroke-dasharray="5,3"/><rect x="652" y="58" width="412" height="500" rx="6" fill="#FCFCFD" stroke="#DDDDDD" stroke-width="1.2"/><text x="668" y="82" font-family="Helvetica" font-size="10.5" font-weight="bold" fill="#444444">training pool</text><rect x="668" y="96" width="217.5" height="18" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><rect x="885.5" y="96" width="162.5" height="18" rx="2" fill="#55A868" stroke="none" stroke-width="0"/><text x="668" y="134" font-family="Helvetica" font-size="8.2" fill="#444444">DENTEX  1,339 images · 21,624 boxes</text><text x="668" y="148" font-family="Helvetica" font-size="8.2" fill="#444444">Tufts    1,000 images · 25,184 boxes</text><text x="668" y="166" font-family="Helvetica" font-size="8.4" font-weight="bold" fill="#444444">combined 2,339 images · 46,808 boxes</text><text x="668" y="198" font-family="Helvetica" font-size="10.5" font-weight="bold" fill="#444444">held-out official DENTEX validation</text><text x="668" y="216" font-family="Helvetica" font-size="8.2" fill="#444444">50 images · 46 pathological · 182 target boxes</text><rect x="668" y="228" width="380" height="64" rx="6" fill="#F2F8F2" stroke="#55A868" stroke-width="1.3"/><text x="682" y="250" font-family="Helvetica" font-size="9.0" font-weight="bold" fill="#2F6B3C">best: DENTEX + Tufts, fold 1</text><text x="682" y="268" font-family="Helvetica" font-size="8.6" fill="#444444">target mAP50 0.9593 · precision 0.9864</text><text x="682" y="284" font-family="Helvetica" font-size="7.8" fill="#777777">deployed as the locate_tooth backend</text><text x="668" y="320" font-family="Helvetica" font-size="10.5" font-weight="bold" fill="#444444">effect of co-training with Tufts</text><text x="668" y="340" font-family="Helvetica" font-size="8.4" fill="#444444">precision 0.9637 -&gt; 0.9680</text><text x="668" y="356" font-family="Helvetica" font-size="8.4" fill="#444444">raw val mAP50 0.5820 -&gt; 0.8695</text><text x="668" y="372" font-family="Helvetica" font-size="7.6" fill="#777777">(different protocol from the target-filtered</text><text x="668" y="384" font-family="Helvetica" font-size="7.6" fill="#777777">CV above - both measured)</text><rect x="668" y="404" width="380" height="130" rx="6" fill="#F4F8FD" stroke="#C7D3E8" stroke-width="1.1"/><text x="682" y="426" font-family="Helvetica" font-size="9.0" font-weight="bold" fill="#34548A">trace-generation guarantee</text><text x="682" y="444" font-family="Helvetica" font-size="7.8" fill="#444444">when the requested tooth exists in the ground truth,</text><text x="682" y="456" font-family="Helvetica" font-size="7.8" fill="#444444">locate_tooth returns its exact box - the detector's</text><text x="682" y="468" font-family="Helvetica" font-size="7.8" fill="#444444">measured accuracy governs only the unannotated-tooth</text><text x="682" y="480" font-family="Helvetica" font-size="7.8" fill="#444444">fallback; what the model is shown is then perturbed</text><text x="682" y="492" font-family="Helvetica" font-size="7.8" fill="#444444">independently (tiered), keeping accept-vs-nudge live</text><defs><marker id="arr4C72B0" vi