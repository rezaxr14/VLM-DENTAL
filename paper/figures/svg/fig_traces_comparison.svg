<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="596" viewBox="0 0 640 596"><rect width="640" height="596" fill="#FFFFFF"/><rect x="10" y="10" width="254" height="468" rx="6" fill="#FBFBFB" stroke="#BBBBBB" stroke-width="1.2"/><text x="137.0" y="32" font-family="Helvetica" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#444444">No-tools trace (baseline)</text><text x="137.0" y="46" font-family="Helvetica" font-size="8.8" text-anchor="middle" fill="#666666">1 turn · 0 tool calls · hindsight description</text><rect x="22" y="56" width="230" height="40" rx="6" fill="#E8EEF7" stroke="#4C72B0" stroke-width="1.1"/><text x="137.0" y="72" font-family="Helvetica" font-size="9.0" font-weight="bold" text-anchor="middle" fill="#34548A">user: panoramic X-ray, tool-free prompt</text><text x="137.0" y="87" font-family="Helvetica" font-size="8.6" text-anchor="middle" fill="#444444">“identify any abnormal teeth and diagnose”</text><polyline points="137.0,96.0 137.0,100.7" fill="none" stroke="#888888" stroke-width="1.3"/><polygon points="137.0,108.0 133.6,100.7 140.4,100.7" fill="#888888" stroke="none"/><rect x="22" y="110" width="230" height="218" rx="6" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.1"/><text x="137.0" y="129" font-family="Helvetica" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#444444">thought (single turn)</text><text x="34" y="148" font-family="Helvetica" font-size="8.6" fill="#333333">“On systematic review of this panoramic radiograph, I</text><text x="34" y="160" font-family="Helvetica" font-size="8.6" fill="#333333">begin by orienting to the patient’s right and left sides</text><text x="34" y="172" font-family="Helvetica" font-size="8.6" fill="#333333">as marked. The image shows a mixed dentition with</text><text x="34" y="184" font-family="Helvetica" font-size="8.6" fill="#333333">multiple developing permanent teeth ...</text><text x="34" y="202" font-family="Helvetica" font-size="8.6" fill="#333333">Focusing on the lower-left quadrant (Q3), I examine</text><text x="34" y="214" font-family="Helvetica" font-size="8.6" fill="#333333">the posterior region ... I can see a radiolucent area</text><text x="34" y="226" font-family="Helvetica" font-size="8.6" fill="#333333">involving the occlusal/cervical portion of the tooth,</text><text x="34" y="238" font-family="Helvetica" font-size="8.6" fill="#333333">with loss of normal enamel contour and a darker</text><text x="34" y="250" font-family="Helvetica" font-size="8.6" fill="#333333">zone consistent with a carious lesion ...”</text><text x="34" y="274" font-family="Helvetica" font-size="8.4" font-style="italic" fill="#666666">One-shot description from the full image:</text><text x="34" y="286" font-family="Helvetica" font-size="8.4" font-style="italic" fill="#666666">no crop, no second look, nothing checkable</text><text x="34" y="298" font-family="Helvetica" font-size="8.4" font-style="italic" fill="#666666">against the pixels it actually saw.</text><polyline points="137.0,328.0 137.0,332.7" fill="none" stroke="#888888" stroke-width="1.3"/><polygon points="137.0,340.0 133.6,332.7 140.4,332.7" fill="#888888" stroke="none"/><rect x="22" y="342" width="230" height="42" rx="6" fill="#F2F8F2" stroke="#55A868" stroke-width="1.3"/><text x="137.0" y="359" font-family="Helvetica" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#2F6B3C">final answer</text><text x="137.0" y="375" font-family="Helvetica" font-size="9.0" text-anchor="middle" fill="#333333">Q3T4 · Caries · confidence 0.82</text><rect x="22" y="394" width="230" height="72" rx="6" fill="#FBF6F0" stroke="#DD8452" stroke-width="1.1"/><text x="137.0" y="411" font-family="Helvetica" font-size="9.6" font-weight="bold" text-anchor="middle" fill="#8A5A2E">What this arm can teach</text><text x="34" y="427" font-family="Helvetica" font-size="8.8" fill="#444444">- output format + clinical vocabulary</text><text x="34" y="440" font-family="Helvetica" font-size="8.8" fill="#444444">- quadrant-survey habit</text><text x="137.0" y="458" font-family="Helvetica" font-size="8.8" font-weight="bold" text-anchor="middle" fill="#C44E52">No evidence trail to verify or correct.</text><rect x="274" y="10" width="356" height="468" rx="6" fill="#FCFCFD" stroke="#4C72B0" stroke-width="1.4"/><text x="452.0" y="32" font-family="Helvetica" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#34548A">With-tools trace (main policy)</text><text x="452.0" y="46" font-family="Helvetica" font-size="8.8" text-anchor="middle" fill="#666666">23 turns · 22 real tool calls · 3 corrective nudges</text><rect x="286" y="56" width="332" height="31" rx="5" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.0"/><rect x="286" y="56" width="4" height="31" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="298" y="75" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#34548A">T0</text><text x="338" y="69" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">window_level</text><text x="338" y="81" font-family="Helvetica" font-size="8.4" fill="#555555">survey the full field at high contrast</text><rect x="286" y="91" width="332" height="31" rx="5" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.0"/><rect x="286" y="91" width="4" height="31" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="298" y="110" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#34548A">T1</text><text x="338" y="104" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">fdi_label</text><text x="338" y="116" font-family="Helvetica" font-size="8.4" fill="#555555">orient to FDI notation first</text><rect x="286" y="126" width="332" height="31" rx="5" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.0"/><rect x="286" y="126" width="4" height="31" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="298" y="145" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#34548A">T2</text><text x="338" y="139" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">locate_tooth(34)</text><text x="338" y="151" font-family="Helvetica" font-size="8.4" fill="#555555">box [1668, 917, 84, 322] (GT-grounded detector)</text><rect x="286" y="161" width="332" height="31" rx="5" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.0"/><rect x="286" y="161" width="4" height="31" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="298" y="180" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#34548A">T3</text><text x="338" y="174" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">zoom_crop</text><text x="338" y="186" font-family="Helvetica" font-size="8.4" fill="#555555">“shows only bone and root area ... too low”</text><rect x="286" y="196" width="332" height="31" rx="5" fill="#FFF4E8" stroke="#F0B27A" stroke-width="1.0"/><rect x="286" y="196" width="4" height="31" rx="2" fill="#ff7f0e" stroke="none" stroke-width="0"/><text x="298" y="215" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#B45A04">T4</text><text x="338" y="209" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">nudge_crop #1</text><text x="338" y="221" font-family="Helvetica" font-size="8.4" fill="#555555">dy -0.3 · scale 0.6 -&gt; [1685, 885, 50, 193]</text><rect x="286" y="231" width="332" height="31" rx="5" fill="#FFF4E8" stroke="#F0B27A" stroke-width="1.0"/><rect x="286" y="231" width="4" height="31" rx="2" fill="#ff7f0e" stroke="none" stroke-width="0"/><text x="298" y="250" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#B45A04">T6</text><text x="338" y="244" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">nudge_crop #2</text><text x="338" y="256" font-family="Helvetica" font-size="8.4" fill="#555555">dy -0.5 · scale 0.7 -&gt; [1693, 818, 35, 135]</text><rect x="286" y="266" width="332" height="31" rx="5" fill="#FFF4E8" stroke="#F0B27A" stroke-width="1.0"/><rect x="286" y="266" width="4" height="31" rx="2" fill="#ff7f0e" stroke="none" stroke-width="0"/><text x="298" y="285" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#B45A04">T8</text><text x="338" y="279" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">nudge_crop #3</text><text x="338" y="291" font-family="Helvetica" font-size="8.4" fill="#555555">dy -0.6 · scale 0.8 -&gt; [1696, 750, 28, 108]</text><rect x="286" y="301" width="332" height="31" rx="5" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.0"/><rect x="286" y="301" width="4" height="31" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="298" y="320" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#34548A">T9-10</text><text x="338" y="314" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">zoom + denoise</text><text x="338" y="326" font-family="Helvetica" font-size="8.4" fill="#555555">“Excellent! Now I can clearly see tooth 34”</text><rect x="286" y="336" width="332" height="31" rx="5" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.0"/><rect x="286" y="336" width="4" height="31" rx="2" fill="#4C72B0" stroke="none" stroke-width="0"/><text x="298" y="355" font-family="Helvetica" font-size="8.8" font-weight="bold" fill="#34548A">T14+</text><text x="338" y="349" font-family="Helvetica" font-size="9.4" font-weight="bold" fill="#444444">compare + enhance</text><text x="338" y="361" font-family="Helvetica" font-size="8.4" fill="#555555">contralateral check, contrast pass, re-verify</text><rect x="286" y="373" width="332" height="44" rx="6" fill="#F2F8F2" stroke="#55A868" stroke-width="1.4"/><text x="452.0" y="392" font-family="Helvetica" font-size="9.4" font-weight="bold" text-anchor="middle" fill="#2F6B3C">final answer (turn 22) · Q3T4 · Caries · conf 0.82</text><text x="452.0" y="408" font-family="Helvetica" font-size="8.8" text-anchor="middle" fill="#555555">matches ground truth - passed strict verification</text><rect x="286" y="425" width="332" height="41" rx="6" fill="#F7F9FC" stroke="#C9D4E4" stroke-width="1.0"/><text x="452.0" y="445" font-family="Helvetica" font-size="8.8" text-anchor="middle" fill="#34548A">22 real tool calls · 3 corrective · every observation</text><text x="452.0" y="458" font-family="Helvetica" font-size="8.8" text-anchor="middle" fill="#34548A">executed against the actual radiograph</text><rect x="10" y="488" width="620" height="98" rx="6" fill="#F7F8FA" stroke="#DDDDDD" stroke-width="1.1"/><text x="22" y="510" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#444444">What the exact 1:1 pairing isolates</text><rect x="318" y="496" width="300" height="22" rx="11" fill="#EEF2FA" stroke="#4C72B0" stroke-width="1.1"/><text x="468" y="511" font-family="Helvetica" font-size="8.6" font-weight="bold" text-anchor="middle" fill="#34548A">5 cohorts × 2 arms · 1,847 + 1,847 · 3,694 verified traces</text><text x="22" y="536" font-family="Helvetica" font-size="8.8" fill="#333333">same image · same prompt template · same ground truth -</text><text x="22" y="548" font-family="Helvetica" font-size="8.8" fill="#333333">only the tool channel differs</text><text x="322" y="536" font-family="Helvetica" font-size="8.8" fill="#333333">any SFT delta is attributable to demonstrated tool use,</text><text x="322" y="548" font-family="Helvetica" font-size="8.8" fill="#333333">not to data volume or prompt wording</text><text x="22" y="564" font-family="Helvetica" font-size="8.8" fill="#333333">with-tools traces carry 44,350 executed tool calls;</text><text x="22" y="576" font-family="Helvetica" font-size="8.8" fill="#333333">the no-tools arm carries zero</text><text x="322" y="564" font-family="Helvetica" font-size="8.8" fill="#333333">per-cohort counts match exactly (678/27/660/202/280</text><text x="322" y="576" font-family="Helvetica" font-size="8.8" fill="#333333">on each side) - parity by construction</text></svg>