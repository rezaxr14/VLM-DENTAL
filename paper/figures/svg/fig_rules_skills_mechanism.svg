<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1090" viewBox="0 0 1528 1090" role="img" aria-labelledby="title desc"><title id="title">Rules and skills</title><desc id="desc">Standalone approval draft: concrete versioned output, tooth-identity and final-findings rules, a five-file skill library, policy context layers, an actual caries-vs-deep-caries request and body excerpt, and disclosure logging. No crop workflow is repeated.</desc><rect x="5" y="5" width="1518" height="1080" rx="12" fill="#FFFFFF" stroke="#17324A" stroke-width="2.5"/><text x="36" y="53" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="bold" fill="#17324A">Rules and skills: how the harness changes the policy context</text><text x="36" y="93" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" fill="#536A7C">Explicit contracts + progressive disclosure; the learned checkpoint and diagnostic tools are shared</text><line x1="36" y1="113" x2="1492" y2="113" stroke="#CBD8E1" stroke-width="1.5"/><rect x="34" y="138" width="410" height="386" rx="9" fill="#EEF4FC" stroke="#2865A7" stroke-width="1.8"/><rect x="49" y="153" width="32" height="32" rx="5" fill="#2865A7" stroke="#2865A7" stroke-width="0"/><text x="65" y="177" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">a</text><text x="95" y="177" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#2865A7">Rule contract</text><text x="54" y="220" text-anchor="start" font-family="DejaVu Sans Mono, monospace" font-size="27" font-weight="bold" fill="#2865A7">rules.md  |  v1.1.0</text><text x="54" y="265" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2865A7">R007  Output structure</text><text x="54" y="298" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#17324A">One JSON object per turn.</text><line x1="54" y1="318" x2="424" y2="318" stroke="#CBD8E1" stroke-width="1.5"/><text x="54" y="353" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2865A7">R018  Tooth identity</text><text x="54" y="386" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" fill="#17324A">Use FDI two-digit tooth numbers.</text><line x1="54" y1="405" x2="424" y2="405" stroke="#CBD8E1" stroke-width="1.5"/><text x="54" y="440" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2865A7">R008  Final findings</text><text x="54" y="473" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#17324A">List all investigated findings.</text><text x="54" y="505" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" fill="#17324A">No target pathology: empty list [].</text><rect x="545" y="138" width="466" height="386" rx="9" fill="#FFFFFF" stroke="#17324A" stroke-width="1.8"/><rect x="560" y="153" width="32" height="32" rx="5" fill="#17324A" stroke="#17324A" stroke-width="0"/><text x="576" y="177" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">b</text><text x="606" y="177" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324A">Policy context</text><rect x="564" y="211" width="428" height="67" rx="5" fill="#EEF4FC" stroke="#2865A7" stroke-width="1.6"/><text x="580" y="240" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" fill="#2865A7">System instructions</text><text x="580" y="266" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" fill="#536A7C">