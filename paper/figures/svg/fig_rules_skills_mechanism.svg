eight="normal" fill="#17324A">healthy-scan-negative-survey</text><text x="1104" y="506" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" fill="#536A7C">Each file: version, sources, body</text><text x="34" y="594" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17324A">d   On-demand retrieval during an episode</text><rect x="34" y="630" width="410" height="240" rx="9" fill="#FFFFFF" stroke="#2865A7" stroke-width="1.8"/><rect x="49" y="645" width="32" height="32" rx="5" fill="#2865A7" stroke="#2865A7" stroke-width="0"/><text x="65" y="669" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">1</text><text x="95" y="669" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#2865A7">Policy requests context</text><text x="54" y="717" text-anchor="start" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="normal" fill="#17324A">tool: read_skill</text><text x="54" y="757" text-anchor="start" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="normal" fill="#17324A">args.name:</text><text x="54" y="797" text-anchor="start" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="normal" fill="#17324A">caries-vs-deep-caries</text><text x="54" y="844" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" fill="#536A7C">A harness action, not tool #9.</text><rect x="545" y="630" width="466" height="240" rx="9" fill="#FFFFFF" stroke="#087F83" stroke-width="1.8"/><rect x="560" y="645" width="32" height="32" rx="5" fill="#087F83" stroke="#087F83" stroke-width="0"/><text x="576" y="669" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">2</text><text x="606" y="669" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#087F83">Dispatcher + session</text><text x="565" y="717" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" fill="#17324A">Validate the requested name.</text><text x="565" y="757" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" fill="#17324A">Read the allow-listed skill file.</text><text x="565" y="797" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" fill="#17324A">Return body, version and sources.</text><text x="565" y="844" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" fill="#536A7C">No diagnostic tool is executed.</text><rect x="1084" y="630" width="410" height="240" rx="9" fill="#FFF2E3" stroke="#BD641B" stroke-width="1.8"/><rect x="1099" y="645" width="32" height="32" rx="5" fill="#BD641B" stroke="#BD641B" stroke-width="0"/><text x="1115" y="669" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">3</text><text x="1145" y="669" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#BD641B">Retrieved content</text><text x="1104" y="716" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#BD641B">SKILL  caries-vs-deep-caries</text><text x="1104" y="753" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#17324A">Caries and Deep Caries are</text><text x="1104" y="785" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#17324A">distinct permitted output</text><text x="1104" y="817" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#17324A">labels. [S2]</text><text x="1104" y="850" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#BD641B">v1.2.0 + source references</text><polyline points="444.0,759.0 531.0,759.0" fill="none" stroke="#2865A7" stroke-width="2.5"/><polygon points="545.0,759.0 531.0,765.5 531.0,752.5" fill="#2865A7" stroke="none"/><polyline points="1011.0,759.0 1070.0,759.0" fill="none" stroke="#087F83" stroke-width="2.5"/><polygon points="1084.0,759.0 1070.0,765.5 1070.0,752.5" fill="#087F83" stroke="none"/><polyline points="1289.0,630.0 1289.0,566.0 1046.0,566.0 1046.0,469.0 1026.7,469.0" fill="none" stroke="#BD641B" stroke-width="2.8"/><polygon points="1011.0,469.0 1026.7,461.7 1026.7,476.3" fill="#BD641B" stroke="none"/><text x="1120" y="554" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#BD641B">append to history</text><polyline points="778.0,870.0 778.0,909.1" fill="none" stroke="#337857" stroke-width="2.3"/><polygon points="778.0,922.0 772.0,909.1 784.0,909.1" fill="#337857" stroke="none"/><rect x="34" y="923" width="1460" height="124" rx="9" fill="#EAF5ED" stroke="#337857" stroke-width="1.8"/><rect x="49" y="938" width="32" height="32" rx="5" fill="#337857" stroke="#337857" stroke-width="0"/><text x="65" y="962" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">e</text><text x="95" y="962" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#337857">Observable intervention</text><text x="54" y="999" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" fill="#337857">harness_events: listed / loaded; skill, version, content hash, turn, elapsed time and mode</text><text x="54" y="1031" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" fill="#17324A">Rules-only = prompt identity control. On-demand = index first. Full injection = all five bodies first.</text><text x="34" y="1074" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#536A7C">Source-grounded schematic: rules.md, skills.py and the shared dispatcher. Skill excerpt is from the existing file, not a new clinical rule.</text></svg>