# RTX 4090 (24 GB VRAM) overrides.
# Merge on top of default.yaml when running on the 4090.
#
# Same Qwen/Qwen3.5-9B backbone as default.yaml — this tier scales GRPO group
# size and detector batch size, not model size. (Single 9B tier runs everywhere,
# including free Kaggle/Colab T4s via 4-bit QLoRA and Unsloth.)

training:
  grpo_group_size: 8
  detector_batch_size: 4
